name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Format, vet, unit, race, static build, and module checks
        run: make validate
      - name: Check reachable Go vulnerabilities
        run: make vuln
      - name: Cross-compile release targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            echo "Building ${goos}/${goarch}"
            GOOS=${goos} GOARCH=${goarch} go build -trimpath -o /dev/null ./cmd/deadair
          done
      - name: Test GitHub Action wrapper
        run: bash .github/actions/deadair/test.sh
      - name: Check release notes workflow
        run: bash .github/release-notes/test.sh

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Static build
        run: go build -trimpath ./cmd/deadair
        env:
          CGO_ENABLED: "0"
