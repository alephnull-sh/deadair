name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate source
        run: make validate
      - name: Build six release targets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make release
          cp dist/checksums.txt binary-checksums.txt
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/deadair_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Add SBOM checksum and verify assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for target in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            extension=""
            case "$target" in windows-*) extension=".exe" ;; esac
            test -s "dist/deadair_${VERSION}_${target}${extension}"
          done
          (cd dist && sha256sum "deadair_${VERSION}_sbom.spdx.json" >> checksums.txt)
          test "$(wc -l < dist/checksums.txt)" -eq 7
          (cd dist && sha256sum --check checksums.txt)
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest binary SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: binary-checksums.txt
          sbom-path: dist/deadair_${{ github.ref_name }}_sbom.spdx.json
      - name: Prepare release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          notes_path=".github/release-notes/${VERSION}.md"
          if [ ! -s "$notes_path" ]; then
            echo "Missing curated release notes: $notes_path" >&2
            exit 1
          fi
          cp -- "$notes_path" release-notes.md
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/dist/deadair_${GITHUB_REF_NAME}_*
          release/dist/checksums.txt
          --verify-tag
          --notes-file release/release-notes.md
          --title "${GITHUB_REF_NAME}"
